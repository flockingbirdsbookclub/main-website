# Netlify configuration for flockingbirdsbookclub.com
# Nothing here needs changing day to day. Netlify reads this file on every deploy.

[build]
  publish = "."

# Sensible security headers. None of these change how the site looks.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# The pages carry their own images inside them, so they must revalidate on every
# visit. Otherwise a member could see yesterday's merch deadline.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons never change, so let browsers hold onto them for a year.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Friendly short link for the merch page: flockingbirdsbookclub.com/merch
[[redirects]]
  from = "/merch"
  to = "/merch.html"
  status = 301
  force = true
